<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة الثانوية العامة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#f7f3ea;
    --card:#ffffff;
    --ink:#25332c;
    --muted:#7c8a80;
    --sage:#3f6f5e;
    --sage-dark:#294c40;
    --sage-soft:#e7f0ec;
    --amber:#c99a4b;
    --amber-soft:#f7ecd8;
    --rose:#b3564d;
    --rose-soft:#f8e9e7;
    --line: rgba(37,51,44,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Tajawal', sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header{
    width:100%;
    background:linear-gradient(160deg, var(--sage) 0%, var(--sage-dark) 100%);
    color:#fbf8f1;
    text-align:center;
    padding:52px 20px 60px;
    position:relative;
    overflow:hidden;
  }
  header .eyebrow{
    font-size:13px;
    letter-spacing:2px;
    opacity:0.7;
    margin-bottom:10px;
    font-family:'Tajawal', sans-serif;
  }
  header h1{
    margin:0 0 8px;
    font-size:30px;
    font-family:'Almarai', sans-serif;
    font-weight:800;
    letter-spacing:0.5px;
  }
  header p{
    margin:0;
    opacity:0.85;
    font-size:15px;
  }
  .wave{
    position:absolute;
    bottom:-1px; left:0; right:0;
    width:100%;
    height:36px;
    display:block;
  }
  main{
    width:100%;
    max-width:520px;
    padding:0 18px;
    margin-top:-32px;
    position:relative;
    z-index:2;
  }
  .card{
    background:var(--card);
    border-radius:20px;
    box-shadow:0 16px 40px rgba(41,76,64,0.14);
    padding:26px 22px;
    margin-bottom:22px;
    border:1px solid var(--line);
  }
  .card h2{
    font-size:16px;
    margin:0 0 16px;
    color:var(--sage-dark);
    font-family:'Almarai', sans-serif;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .search-row{
    display:flex;
    gap:10px;
  }
  input[type=text]{
    flex:1;
    padding:15px 16px;
    border-radius:12px;
    border:2px solid var(--line);
    font-size:18px;
    text-align:center;
    letter-spacing:1px;
    font-family:'Tajawal', sans-serif;
    background:#fcfbf8;
    transition:border-color 0.2s;
  }
  input[type=text]:focus{
    outline:none;
    border-color:var(--sage);
    background:#fff;
  }
  button{
    font-family:'Almarai', sans-serif;
    cursor:pointer;
    border:none;
  }
  .btn-search{
    background:var(--sage);
    color:#fff;
    padding:15px 26px;
    border-radius:12px;
    font-size:16px;
    font-weight:700;
    transition:background 0.2s, transform 0.1s;
  }
  .btn-search:active{background:var(--sage-dark); transform:scale(0.98);}
  .not-found{
    display:none;
    text-align:center;
    color:var(--rose);
    background:var(--rose-soft);
    border-radius:12px;
    font-size:14px;
    padding:14px;
    margin-top:14px;
  }
  .not-found.show{display:block; animation:fadeIn 0.3s ease;}
  .result{
    display:none;
  }
  .result.show{display:block; animation:fadeIn 0.4s ease;}
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .result-header{
    text-align:center;
    padding:20px 16px 22px;
    margin:16px 0 16px;
    border-radius:14px;
    background:var(--sage-soft);
  }
  .result-header .name{
    font-size:21px;
    font-weight:700;
    font-family:'Almarai', sans-serif;
    color:var(--sage-dark);
  }
  .result-header .seat{
    font-size:13px;
    color:var(--muted);
    margin-top:6px;
  }
  .status-badge{
    display:inline-block;
    padding:7px 18px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
    margin-top:12px;
  }
  .status-badge.pass{background:#fff; color:var(--sage-dark); box-shadow:0 0 0 1.5px var(--sage);}
  .status-badge.fail{background:#fff; color:var(--rose); box-shadow:0 0 0 1.5px var(--rose);}
  .fields{
    display:grid;
    gap:10px;
  }
  .field-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 16px;
    background:var(--amber-soft);
    border-radius:12px;
    font-size:14px;
  }
  .field-row .label{color:#8a7248;}
  .field-row .value{font-weight:700; color:var(--ink); font-family:'Almarai', sans-serif;}
  footer{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    padding:26px 20px 14px;
  }
  .credit{
    text-align:center;
    font-size:12.5px;
    color:var(--sage-dark);
    opacity:0.75;
    padding-bottom:28px;
    font-family:'Almarai', sans-serif;
  }
  .credit span{
    display:block;
    margin-top:2px;
    direction:ltr;
    letter-spacing:0.5px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">نتيجة الصف الثالث الثانوي</div>
  <h1>نتيجة الثانوية العامة</h1>
  <p>اكتب رقم الجلوس وشوف نتيجتك فورًا</p>
  <svg class="wave" viewBox="0 0 500 40" preserveAspectRatio="none">
    <path d="M0,20 C125,40 375,0 500,20 L500,40 L0,40 Z" fill="#f7f3ea"></path>
  </svg>
</header>

<main>
  <div class="card">
    <h2>🔍 البحث برقم الجلوس</h2>
    <div class="search-row">
      <input type="text" id="seatInput" inputmode="numeric" placeholder="رقم الجلوس">
      <button class="btn-search" id="searchBtn">بحث</button>
    </div>
    <div class="not-found" id="notFound">مفيش نتيجة برقم الجلوس ده، تأكد من الرقم.</div>

    <div class="result" id="resultBox">
      <div class="result-header">
        <div class="name" id="rName">—</div>
        <div class="seat" id="rSeat">—</div>
        <div class="status-badge" id="rStatusBadge">—</div>
      </div>
      <div class="fields" id="rFields"></div>
    </div>
  </div>
</main>

<footer>البيانات بتتخزن على السيرفر ومتاحة لأي حد يفتح الرابط</footer>
<div class="credit">تصميم المحاسب محمد عطية<span>01096554393</span></div>

<script>
const SUPABASE_URL = 'https://npgzrltfxxvcufrdizgs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_qnyOKYsymh-ZAByDV0FVTg_cGIOaGnA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function doSearch(){
  const seat = document.getElementById('seatInput').value.trim();
  const resultBox = document.getElementById('resultBox');
  const notFound = document.getElementById('notFound');
  const searchBtn = document.getElementById('searchBtn');
  resultBox.classList.remove('show');
  notFound.classList.remove('show');

  if(!seat) return;

  const originalLabel = searchBtn.textContent;
  searchBtn.textContent = '...';
  searchBtn.disabled = true;

  const { data, error } = await sb
    .from('natega_results')
    .select('*')
    .eq('seating_no', seat)
    .maybeSingle();

  searchBtn.textContent = originalLabel;
  searchBtn.disabled = false;

  if(error){
    notFound.textContent = 'حصل خطأ في الاتصال، حاول تاني.';
    notFound.classList.add('show');
    return;
  }

  if(!data){
    notFound.textContent = 'مفيش نتيجة برقم الجلوس ده، تأكد من الرقم.';
    notFound.classList.add('show');
    return;
  }

  document.getElementById('rName').textContent = data.arabic_name || 'بدون اسم';
  document.getElementById('rSeat').textContent = 'رقم الجلوس: ' + data.seating_no;

  const fieldsEl = document.getElementById('rFields');
  fieldsEl.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'field-row';
  row.innerHTML = `<span class="label">المجموع</span><span class="value">${data.total_degree} / 320</span>`;
  fieldsEl.appendChild(row);

  const percentage = ((data.total_degree / 320) * 100).toFixed(2);
  const pctRow = document.createElement('div');
  pctRow.className = 'field-row';
  pctRow.innerHTML = `<span class="label">النسبة المئوية</span><span class="value">${percentage}%</span>`;
  fieldsEl.appendChild(pctRow);

  const statusVal = data.student_case_desc || '';
  const badge = document.getElementById('rStatusBadge');
  if(statusVal){
    const isFail = statusVal.includes('راسب') || statusVal.includes('غياب');
    badge.textContent = statusVal;
    badge.className = 'status-badge ' + (isFail ? 'fail' : 'pass');
  }else{
    badge.style.display = 'none';
  }

  resultBox.classList.add('show');
}

document.getElementById('searchBtn').addEventListener('click', doSearch);
document.getElementById('seatInput').addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
